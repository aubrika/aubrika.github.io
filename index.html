<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>aubrika</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; background: #001418; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6c706c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main {
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-weight: 700;
      font-size: clamp(1.5rem, 6vw, 4rem);
      /* The glyph fill is transparent; ALL color comes from the clipped
         background. Bottom layer is the resting gray; a click stacks
         traveling color bands on top of it (background-clip:text keeps it
         to the letters). Fill must be transparent or WebKit's opaque fill
         paints over the gradient and you see nothing. */
      color: transparent;
      -webkit-text-fill-color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      background-image: linear-gradient(#6c706c, #6c706c);
      cursor: default;
    }
  </style>
</head>
<body>
  <main>Under Construction</main>
  <script>
    (function () {
      var main = document.querySelector('main');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) return;

      var waves = [];
      var raf = null;
      var DUR = 1300;  // wave lifetime, ms
      var BW = 150;    // band half-width, px (the feather on each side of the crest)
      var BASE = 'linear-gradient(#6c706c, #6c706c)';  // resting gray, always the bottom layer

      function onDown(e) {
        var rect = main.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        // Reach = distance to the farthest corner, so the crest fully clears
        // the text no matter where the click lands (even outside it).
        var corners = [[0, 0], [rect.width, 0], [0, rect.height], [rect.width, rect.height]];
        var max = 0;
        for (var i = 0; i < corners.length; i++) {
          var d = Math.hypot(corners[i][0] - x, corners[i][1] - y);
          if (d > max) max = d;
        }
        waves.push({ x: x, y: y, t0: performance.now(), reach: max });
        if (!raf) raf = requestAnimationFrame(frame);
      }

      function frame(now) {
        var layers = [];
        for (var i = waves.length - 1; i >= 0; i--) {
          var w = waves[i];
          var p = (now - w.t0) / DUR;
          if (p >= 1) { waves.splice(i, 1); continue; }
          var r = p * (w.reach + BW * 2);        // crest radius travels outward
          var fade = 1 - p * p * p;               // near-full most of the way, quick clear at the end
          var a1 = fade.toFixed(3);               // lilac halo alpha (opaque at peak)
          var a2 = fade.toFixed(3);               // deep-purple core alpha
          var cx = w.x.toFixed(1), cy = w.y.toFixed(1);
          // Band is its own gradient: #583c48 halo -> #443444 core -> #583c48 halo.
          // Opaque over the transparent glyph fill, so it fully replaces the gray as
          // it passes -> color and motion through the letters.
          layers.push(
            'radial-gradient(circle at ' + cx + 'px ' + cy + 'px,' +
            ' transparent ' + Math.max(0, r - BW).toFixed(1) + 'px,' +
            ' rgba(88,60,72,' + a1 + ') ' + Math.max(0, r - BW * 0.5).toFixed(1) + 'px,' +
            ' rgba(68,52,68,' + a2 + ') ' + r.toFixed(1) + 'px,' +
            ' rgba(88,60,72,' + a1 + ') ' + (r + BW * 0.5).toFixed(1) + 'px,' +
            ' transparent ' + (r + BW).toFixed(1) + 'px)'
          );
        }
        layers.push(BASE);   // resting gray underneath every wave
        main.style.backgroundImage = layers.join(',');
        raf = waves.length ? requestAnimationFrame(frame) : null;
      }

      window.addEventListener('pointerdown', onDown);
    })();
  </script>
</body>
</html>
