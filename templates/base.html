<!doctype html>
<html lang="{{ config.default_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path='blog/atom.xml', trailing_slash=false) }}">
</head>
<body>
  {%- set here = current_path | default(value="/") %}
  <header class="site">
    <a class="name" href="{{ get_url(path='/') }}"{% if here == "/" %} aria-current="page"{% endif %}>{{ config.title }}</a>
    <nav>
      <a href="{{ get_url(path='@/blog/_index.md') }}"
        {%- if here == "/blog/" %} aria-current="page"{% elif here is starting_with("/blog/") %} aria-current="true"{% endif %}>Blog</a>
      <a href="{{ config.extra.github | safe }}">GitHub</a>
      <a href="{{ config.extra.bluesky | safe }}">Bluesky</a>
      <a href="{{ get_url(path='blog/atom.xml', trailing_slash=false) }}">Feed</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock content %}
  </main>
</body>
</html>
